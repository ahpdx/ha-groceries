<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Groceries{% endblock %}</title>
{% block head %}{% endblock %}
<style>
:root{
  --bg:#ffffff; --card:#ffffff; --soft:#f3f3f3; --ink:#111111; --muted:#666666; --line:#d6d6d6; --strong:#8a8a8a;
  --radius:6px; color-scheme:light dark;
  /* status colors only (standard "subtle" palette): green done, blue info, amber attention, red problem */
  --ok:#0f5132; --ok-bg:#d1e7dd; --ok-line:#a3cfbb;
  --info:#055160; --info-bg:#cff4fc; --info-line:#9eeaf9;
  --warn:#664d03; --warn-bg:#fff3cd; --warn-line:#ffe69c;
  --bad:#842029; --bad-bg:#f8d7da; --bad-line:#f1aeb5;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161616; --card:#1c1c1c; --soft:#252525; --ink:#ececec; --muted:#9b9b9b; --line:#383838; --strong:#777777;
    --ok:#75b798; --ok-bg:#051b11; --ok-line:#0f5132; --info:#6edff6; --info-bg:#032830; --info-line:#087990;
    --warn:#ffda6a; --warn-bg:#332701; --warn-line:#997404; --bad:#ea868f; --bad-bg:#2c0b0e; --bad-line:#842029; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:underline;text-underline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav{display:flex;gap:18px;max-width:760px;margin:0 auto;padding:12px 16px;overflow-x:auto}
nav a{text-decoration:none;color:var(--muted);white-space:nowrap}
nav a.on{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:6px}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:600;margin:4px 0 12px}
h2{font-size:17px;font-weight:600;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
textarea,input[type=text],input[type=number],input[type=url],input[type=search]{
  width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--strong);border-radius:4px;padding:9px}
textarea{min-height:220px;resize:vertical}
input[type=number]{width:72px}
button,.btn{font:inherit;border:1px solid var(--strong);background:var(--soft);color:var(--ink);
  border-radius:4px;padding:9px 14px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.primary,.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
button.link{border:none;background:none;color:var(--ink);padding:6px 2px;min-height:auto;text-decoration:underline;text-underline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.banner{border:1px solid var(--line);background:var(--soft);border-radius:4px;padding:10px 14px;margin:10px 0}
.banner.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info)}
.banner.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.badge{display:inline-block;font-size:12px;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:1px 6px;white-space:nowrap}
.b-auto,.b-chosen,.b-ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.b-confirm{background:var(--info-bg);border-color:var(--info-line);color:var(--info)}
.b-ask,.b-unknown,.b-pending{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.b-not_found,.b-failed,.b-fails{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.b-skipped{border-style:dashed}
.prod{display:flex;gap:10px;align-items:flex-start}
.prod img{width:56px;height:56px;object-fit:contain;border-radius:4px;background:#fff;border:1px solid var(--line);flex:none}
.prod .ph{width:56px;height:56px;border-radius:4px;background:var(--soft);border:1px solid var(--line);flex:none}
.cand{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:var(--radius);margin:8px 0}
.cand:has(input:checked){border-color:var(--ink)}
.cand input[type=radio]{margin-top:20px;width:20px;height:20px;flex:none;accent-color:var(--ink)}
input[type=checkbox]{accent-color:var(--ink)}
.price{font-weight:600} .was{text-decoration:line-through;color:var(--muted);font-weight:400}
.note{font-size:14px;color:var(--muted)}
.sale{font-size:14px;background:var(--info-bg);border:1px solid var(--info-line);color:var(--info);border-radius:4px;padding:8px 10px;margin-top:8px}
.footer{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 16px;margin:16px -16px 0}
.footer .row{flex-wrap:nowrap} .footer button{padding:8px 12px}
details summary{cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:2px}
table{width:100%;border-collapse:collapse} td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600}
.tabs{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.tabs a{text-decoration:none;color:var(--muted)}
.tabs a.on{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:6px}
code{background:var(--soft);padding:1px 5px;border-radius:3px}
@media (max-width:520px){ .hide-sm{display:none} }
</style>
</head>
<body>
<header><nav>
  <a href="{{ base }}/" class="{{ 'on' if path in ('/', '') or path.startswith('/runs') }}">List</a>
  <a href="{{ base }}/saved" class="{{ 'on' if path.startswith('/saved') }}">Saved</a>
  <a href="{{ base }}/history" class="{{ 'on' if path.startswith('/history') }}">History</a>
  <a href="{{ base }}/settings" class="{{ 'on' if path.startswith('/settings') }}">Settings{% if not signed_in %} ⚠︎{% endif %}</a>
</nav></header>
<main>
{% if msg %}<div class="banner info">{{ msg }}</div>{% endif %}
{% block body %}{% endblock %}
</main>
</body>
</html>
