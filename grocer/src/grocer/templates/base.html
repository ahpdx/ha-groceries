<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Groceries{% endblock %}</title>
{% block head %}{% endblock %}
<style>
:root{
  --bg:#f6f7f5; --card:#ffffff; --ink:#1d2321; --muted:#5f6b66; --line:#dfe4e1;
  --accent:#1f6f50; --accent-ink:#ffffff; --warn:#9a5b00; --warn-bg:#fff4e0; --bad:#a3262a; --bad-bg:#fdeaea;
  --ok:#1f6f50; --ok-bg:#e4f3ec; --info-bg:#e9f0fb; --info:#24508f; --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121614; --card:#1b201e; --ink:#e7ece9; --muted:#9aa7a1; --line:#2c3431;
    --accent:#4fb98c; --accent-ink:#08140f; --warn:#f0b45a; --warn-bg:#2b2213; --bad:#f08a8d; --bad-bg:#2d1718;
    --ok:#6fd0a5; --ok-bg:#14271f; --info-bg:#16202e; --info:#8fb5ef; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav{display:flex;gap:4px;max-width:760px;margin:0 auto;padding:8px 12px;overflow-x:auto}
nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);white-space:nowrap;font-weight:600;font-size:15px}
nav a.on{background:var(--ok-bg);color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:17px;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
textarea,input[type=text],input[type=number],input[type=url],input[type=search]{
  width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:220px;resize:vertical}
input[type=number]{width:72px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.link{border:none;background:none;color:var(--accent);padding:6px;min-height:auto;font-weight:500}
button:disabled{opacity:.5;cursor:not-allowed}
.banner{border-radius:var(--radius);padding:10px 14px;margin:10px 0}
.banner.info{background:var(--info-bg);color:var(--info)} .banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)} .banner.ok{background:var(--ok-bg);color:var(--ok)}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:2px 8px;text-transform:uppercase}
.b-auto,.b-chosen,.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-confirm{background:var(--info-bg);color:var(--info)}
.b-ask,.b-unknown,.b-pending{background:var(--warn-bg);color:var(--warn)}
.b-not_found,.b-failed,.b-fails{background:var(--bad-bg);color:var(--bad)}
.b-skipped{background:var(--line);color:var(--muted)}
.prod{display:flex;gap:10px;align-items:flex-start}
.prod img{width:56px;height:56px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.prod .ph{width:56px;height:56px;border-radius:8px;background:var(--line);flex:none}
.cand{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0}
.cand input[type=radio]{margin-top:20px;width:20px;height:20px;flex:none}
.price{font-weight:700} .was{text-decoration:line-through;color:var(--muted);font-weight:400}
.note{font-size:14px;color:var(--muted)}
.sale{font-size:14px;background:var(--info-bg);color:var(--info);border-radius:10px;padding:8px 10px;margin-top:8px}
.footer{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 16px;margin:16px -16px 0}
.footer .row{flex-wrap:nowrap} .footer button{padding:8px 12px}
details summary{cursor:pointer;color:var(--accent);font-weight:600;padding:6px 0}
table{width:100%;border-collapse:collapse} td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs a{padding:6px 12px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--muted)}
.tabs a.on{background:var(--ok-bg);color:var(--accent);border-color:transparent}
code{background:var(--bg);padding:1px 5px;border-radius:6px}
@media (max-width:520px){ .hide-sm{display:none} }
</style>
</head>
<body>
<header><nav>
  <a href="{{ base }}/" class="{{ 'on' if path in ('/', '') or path.startswith('/runs') }}">List</a>
  <a href="{{ base }}/saved" class="{{ 'on' if path.startswith('/saved') }}">Saved</a>
  <a href="{{ base }}/history" class="{{ 'on' if path.startswith('/history') }}">History</a>
  <a href="{{ base }}/settings" class="{{ 'on' if path.startswith('/settings') }}">Settings{% if not signed_in %} ⚠︎{% endif %}</a>
</nav></header>
<main>
{% if msg %}<div class="banner info">{{ msg }}</div>{% endif %}
{% block body %}{% endblock %}
</main>
</body>
</html>
